<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Upload Questions - TNPSC Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
        }
        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .container { max-width: 1200px; padding: 20px; }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            margin-bottom: 20px;
        }
        h1 { color: var(--dark); margin-bottom: 10px; }
        .subtitle { color: #64748b; margin-bottom: 30px; }
        
        .drop-zone {
            border: 3px dashed #cbd5e1;
            border-radius: 16px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8fafc;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: #ede9fe;
        }
        .drop-zone i { font-size: 64px; color: var(--primary); margin-bottom: 20px; }
        
        .file-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .file-item .icon { font-size: 24px; color: var(--primary); margin-right: 12px; }
        .file-item .name { flex: 1; font-weight: 500; min-width: 200px; }
        .file-item .questions { color: #64748b; margin-right: 12px; }
        .file-item .status { min-width: 150px; text-align: center; }
        .file-item .status.pending { color: #f59e0b; }
        .file-item .status.success { color: var(--success); }
        .file-item .status.error { color: var(--danger); }
        .file-item .status.uploading { color: #2196F3; }
        .file-item .session-select { margin-left: 10px; width: 200px; }
        
        .btn-upload {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-upload:hover { transform: scale(1.05); color: white; }
        .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .progress-section { margin-top: 30px; }
        .progress { height: 24px; border-radius: 12px; }
        .progress-bar { 
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: bold; color: var(--dark); }
        .stat-card .label { color: #64748b; font-size: 14px; }
        
        .log-section {
            background: var(--dark);
            color: #10b981;
            padding: 20px;
            border-radius: 12px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 12px;
        }
        .log-section .error { color: #ef4444; }
        .log-section .success { color: #10b981; }
        .log-section .info { color: #60a5fa; }
        .log-section .warn { color: #f59e0b; }
        
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="text-center">
                <h1><i class="fas fa-cloud-upload-alt"></i> Bulk Upload Questions</h1>
                <p class="subtitle">Upload all JSON files - auto match to sessions!</p>
            </div>
            
            <!-- Drop Zone -->
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-folder-open"></i>
                <h3>Drop JSON Files Here</h3>
                <p>or click to browse</p>
                <p class="text-muted">Select all files from C:\question folder</p>
                <input type="file" id="fileInput" multiple accept=".json" style="display:none" onchange="handleFiles(this.files)">
            </div>
            
            <div class="stats" id="statsSection" style="display:none">
                <div class="stat-card">
                    <div class="number" id="totalFiles">0</div>
                    <div class="label">Total Files</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalQuestions">0</div>
                    <div class="label">Total Questions</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="uploadedCount">0</div>
                    <div class="label">Uploaded</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="failedCount">0</div>
                    <div class="label">Failed</div>
                </div>
            </div>
            
            <div class="file-list" id="fileList"></div>
            
            <div class="text-center mt-4">
                <button class="btn-upload" id="uploadBtn" onclick="startUpload()" disabled>
                    <i class="fas fa-rocket"></i> Start Bulk Upload
                </button>
            </div>
            
            <div class="progress-section" id="progressSection" style="display:none">
                <div class="d-flex justify-content-between mb-2">
                    <span id="progressText">Preparing...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="log-section" id="logSection" style="display:none"></div>
        </div>
        
        <div class="text-center">
            <a href="index.html" class="btn btn-light">
                <i class="fas fa-arrow-left"></i> Back to Admin Panel
            </a>
        </div>
    </div>

    <script>
        const API_BASE = '../api/admin';
        let selectedFiles = [];
        let sessions = [];
        let sessionsLoaded = false;
        let sessionsLoadError = null;
        let totalUploaded = 0;
        let totalFailed = 0;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', loadSessions);
        
        // Drag and drop
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        function normalizeForMatch(str) {
            if (!str) return '';
            return String(str)
                .toLowerCase()
                .replace(/&/g, ' and ')
                .replace(/_/g, ' ')
                .replace(/-/g, ' ')
                .replace(/[()]/g, ' ')
                .replace(/[^a-z0-9\u0B80-\u0BFF ]+/g, ' ')
                .replace(/\b(mcq|question|questions|practice|test|paper|set|poem|prose|drama)\b/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function loadSessions(force = false) {
            try {
                if (sessionsLoaded && !force) return true;

                sessionsLoaded = false;
                sessionsLoadError = null;

                const res = await fetch(`${API_BASE}/sessions/crud.php`, {
                    method: 'GET',
                    credentials: 'include'
                });

                const raw = await res.text();
                let data = null;
                try {
                    data = raw ? JSON.parse(raw) : null;
                } catch (e) {
                    throw new Error('Invalid server response while loading sessions');
                }

                if (!res.ok || !data || !data.success) {
                    // If session expired, redirect to login
                    if (res.status === 401 || data?.authenticated === false) {
                        alert('Session expired. Please login again.');
                        window.location.href = 'login.html';
                        return false;
                    }
                    throw new Error(data?.message || data?.error || `Failed to load sessions (HTTP ${res.status})`);
                }

                sessions = Array.isArray(data.sessions) ? data.sessions : [];
                // Add normalized name for faster matching + sort for easier manual selection
                sessions = sessions.map(s => ({ ...s, _norm: normalizeForMatch(s.name) }))
                    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }));

                sessionsLoaded = true;
                return true;
            } catch (e) {
                sessionsLoadError = e.message || 'Could not load sessions';
                console.error('❌ Could not load sessions:', e);
                // Show an on-screen error (log section is hidden until upload starts)
                const fileListEl = document.getElementById('fileList');
                if (fileListEl) {
                    fileListEl.innerHTML = `
                        <div class="alert alert-danger" style="margin-top: 15px;">
                            <strong>Could not load sessions.</strong><br>
                            ${sessionsLoadError}<br><br>
                            <a class="btn btn-sm btn-light" href="login.html">Go to Login</a>
                        </div>
                    `;
                }
                return false;
            }
        }
        
        function findSessionByName(filename) {
            // Supports filenames like:
            // - Abbreviations_MCQ_Questions_51q.json
            // - Active_Voice_and_Passive_Voice_MCQ_Questions_61q.json
            let base = String(filename || '')
                .replace(/\.json$/i, '')
                .replace(/_\d+Qs?_\d+$/i, '')                 // old pattern: _28Qs_1765...
                .replace(/_MCQ_Questions?_?\d+q$/i, '')        // ..._MCQ_Questions_51q
                .replace(/_MCQ_Questions?$/i, '')              // ..._MCQ_Questions
                .replace(/_\d+q$/i, '')                        // ..._51q
                .replace(/_+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            const target = normalizeForMatch(base);
            if (!target) return null;

            // Exact normalized match
            let session = sessions.find(s => s._norm && s._norm === target);
            if (session) return session;

            // Containment match
            session = sessions.find(s => s._norm && (s._norm.includes(target) || target.includes(s._norm)));
            if (session) return session;

            // Token overlap best match
            const tTokens = target.split(' ').filter(Boolean);
            let best = null;
            let bestScore = 0;
            for (const s of sessions) {
                const sn = s._norm || '';
                if (!sn) continue;
                const sTokens = sn.split(' ').filter(Boolean);
                let score = 0;
                for (const tok of tTokens) {
                    if (sTokens.includes(tok)) score++;
                }
                if (score > bestScore) {
                    bestScore = score;
                    best = s;
                }
            }
            // Require at least 2 matching words to avoid wrong matches
            if (best && bestScore >= 2) return best;

            return null;
        }
        
        async function handleFiles(files) {
            // Ensure sessions are loaded BEFORE building dropdowns
            const ok = await loadSessions();
            if (!ok) return;

            selectedFiles = [];
            let totalQs = 0;
            
            const fileListEl = document.getElementById('fileList');
            fileListEl.innerHTML = '<div class="text-center p-3"><i class="fas fa-spinner fa-spin"></i> Loading files...</div>';
            
            const filePromises = Array.from(files)
                .filter(f => f.name.endsWith('.json'))
                .map(file => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const json = JSON.parse(e.target.result);
                                const questions = json.questions || json;
                                const qCount = Array.isArray(questions) ? questions.length : 0;
                                const session = findSessionByName(file.name);
                                
                                resolve({
                                    file: file,
                                    name: file.name,
                                    rawQuestions: questions,
                                    count: qCount,
                                    sessionName: session?.name || null,
                                    sessionId: session?.id || null
                                });
                            } catch (err) {
                                log('⚠️ Error parsing ' + file.name + ': ' + err.message, 'error');
                                resolve(null);
                            }
                        };
                        reader.readAsText(file);
                    });
                });
            
            const results = await Promise.all(filePromises);
            selectedFiles = results.filter(r => r !== null);
            
            // Render file list with session selection
            fileListEl.innerHTML = '';
            let matchedCount = 0;
            
            selectedFiles.forEach((fd, idx) => {
                totalQs += fd.count;
                if (fd.sessionId) matchedCount++;
                
                const item = document.createElement('div');
                item.className = 'file-item';
                item.id = `file-${idx}`;
                const label = (s) => {
                    const parts = [];
                    if (s.exam_category_name) parts.push(s.exam_category_name);
                    if (s.category_name) parts.push(s.category_name);
                    parts.push(s.name);
                    return parts.join(' / ');
                };

                item.innerHTML = `
                    <i class="fas fa-file-code icon"></i>
                    <div class="name">${fd.name}</div>
                    <div class="questions">${fd.count} Qs</div>
                    <select class="form-select session-select" id="session-${idx}" onchange="updateSession(${idx}, this.value)">
                        <option value="">-- Select Session --</option>
                        ${sessions.map(s => `
                            <option value="${s.id}" ${s.id === fd.sessionId ? 'selected' : ''}>
                                ${label(s)}
                            </option>
                        `).join('')}
                    </select>
                    <div class="status ${fd.sessionId ? 'pending' : 'error'}" id="status-${idx}">
                        ${fd.sessionId ? '⏳ Ready' : '❌ Select session'}
                    </div>
                `;
                fileListEl.appendChild(item);
            });
            
            document.getElementById('statsSection').style.display = 'grid';
            document.getElementById('totalFiles').textContent = selectedFiles.length;
            document.getElementById('totalQuestions').textContent = totalQs;
            document.getElementById('uploadBtn').disabled = matchedCount === 0;
            
            log(`📁 Loaded ${selectedFiles.length} files with ${totalQs} total questions`, 'info');
            log(`✅ ${matchedCount} files auto-matched to sessions`, 'success');
        }
        
        function updateSession(idx, sessionId) {
            const session = sessions.find(s => s.id == sessionId);
            selectedFiles[idx].sessionId = sessionId ? parseInt(sessionId) : null;
            selectedFiles[idx].sessionName = session?.name || null;
            
            const statusEl = document.getElementById(`status-${idx}`);
            if (sessionId) {
                statusEl.className = 'status pending';
                statusEl.textContent = '⏳ Ready';
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Select session';
            }
            
            // Enable upload button if any file has session
            const hasReady = selectedFiles.some(f => f.sessionId);
            document.getElementById('uploadBtn').disabled = !hasReady;
        }
        
        async function startUpload() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('logSection').style.display = 'block';
            
            const filesToUpload = selectedFiles.filter(f => f.sessionId);
            totalUploaded = 0;
            totalFailed = 0;
            
            log('═══════════════════════════════════════', 'info');
            log(`🚀 Starting upload of ${filesToUpload.length} files...`, 'info');
            
            for (let fIdx = 0; fIdx < filesToUpload.length; fIdx++) {
                const fileData = filesToUpload[fIdx];
                const originalIdx = selectedFiles.indexOf(fileData);
                const statusEl = document.getElementById(`status-${originalIdx}`);
                
                statusEl.className = 'status uploading';
                statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                
                log(`\n📤 [${fIdx + 1}/${filesToUpload.length}] ${fileData.name} → "${fileData.sessionName}"`, 'info');

                // Transform all questions first (client-side) so server receives clean format
                const transformed = [];
                let transformSkipped = 0;
                for (let qIdx = 0; qIdx < (fileData.rawQuestions?.length || 0); qIdx++) {
                    const q = fileData.rawQuestions[qIdx];
                    const apiQuestion = transformQuestion(q, fileData.sessionId, qIdx + 1);
                    if (!apiQuestion) {
                        transformSkipped++;
                        continue;
                    }
                    transformed.push(apiQuestion);
                }

                statusEl.textContent = '📤 Uploading...';

                let added = 0;
                let failed = 0;
                let skipped = transformSkipped;

                try {
                    const res = await fetch(`${API_BASE}/questions/bulk_create.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: fileData.sessionId,
                            replace_existing: true,
                            questions: transformed
                        })
                    });

                    const result = await res.json();

                    if (!res.ok || !result.success) {
                        throw new Error(result?.message || result?.error || `HTTP ${res.status}`);
                    }

                    added = result.added || 0;
                    failed = result.failed || 0;
                    skipped += (result.skipped || 0);

                    // Update totals
                    totalUploaded += added;
                    totalFailed += (failed + skipped);

                    if (failed === 0 && skipped === 0) {
                        statusEl.className = 'status success';
                        statusEl.textContent = `✅ ${added} uploaded`;
                        log(`   ✅ SUCCESS: ${added} questions uploaded!`, 'success');
                    } else if (added > 0) {
                        statusEl.className = 'status success';
                        statusEl.textContent = `⚠️ ${added}/${fileData.count}`;
                        log(`   ⚠️ Uploaded ${added}, Skipped ${skipped}, Failed ${failed}`, 'warn');
                        if (Array.isArray(result.errors) && result.errors.length) {
                            log(`   ⚠️ Sample errors: ${result.errors.join(' | ')}`, 'warn');
                        }
                    } else {
                        statusEl.className = 'status error';
                        statusEl.textContent = `❌ 0/${fileData.count}`;
                        log(`   ❌ Failed (Skipped ${skipped}, Failed ${failed})`, 'error');
                        if (Array.isArray(result.errors) && result.errors.length) {
                            log(`   ❌ Errors: ${result.errors.join(' | ')}`, 'error');
                        }
                    }
                } catch (e) {
                    statusEl.className = 'status error';
                    statusEl.textContent = `❌ Error`;
                    totalFailed += fileData.count;
                    log(`   ❌ Upload error: ${e.message}`, 'error');
                }

                // Update progress (per file)
                const overallProgress = Math.round(((fIdx + 1) / filesToUpload.length) * 100);
                document.getElementById('progressBar').style.width = overallProgress + '%';
                document.getElementById('progressPercent').textContent = overallProgress + '%';
                document.getElementById('progressText').textContent = `File ${fIdx + 1}/${filesToUpload.length} complete`;
                
                document.getElementById('uploadedCount').textContent = totalUploaded;
                document.getElementById('failedCount').textContent = totalFailed;
                
                // Small delay between files
                await new Promise(r => setTimeout(r, 300));
            }
            
            log('═══════════════════════════════════════', 'info');
            log(`🎉 UPLOAD COMPLETE!`, 'success');
            log(`✅ Uploaded: ${totalUploaded} questions`, 'success');
            if (totalFailed > 0) log(`❌ Failed: ${totalFailed} questions`, 'error');
            
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressPercent').textContent = '100%';
            document.getElementById('progressText').textContent = 'Upload Complete!';
            
            btn.innerHTML = '<i class="fas fa-check"></i> Upload Complete!';
        }
        
        function transformQuestion(q, sessionId, displayOrder) {
            // Handle different JSON formats from extraction scripts
            
            // Get question text
            let questionEn = (q.question_en || q.question || '').trim();
            let questionTa = (q.question_ta || '').trim();
            
            // Handle combined En/Ta in single field
            if (questionEn && !questionTa) {
                const parts = splitEnTa(questionEn);
                questionEn = parts.en;
                questionTa = parts.ta;
            }
            
            // Get options (handle both formats)
            let optA_en = '', optA_ta = '';
            let optB_en = '', optB_ta = '';
            let optC_en = '', optC_ta = '';
            let optD_en = '', optD_ta = '';
            
            if (q.options) {
                // Format: { "A": "...", "B": "...", ... }
                optA_en = (q.options.A || q.options.a || '').trim();
                optB_en = (q.options.B || q.options.b || '').trim();
                optC_en = (q.options.C || q.options.c || '').trim();
                optD_en = (q.options.D || q.options.d || '').trim();
            }
            
            if (q.options_ta) {
                optA_ta = (q.options_ta.A || q.options_ta.a || '').trim();
                optB_ta = (q.options_ta.B || q.options_ta.b || '').trim();
                optC_ta = (q.options_ta.C || q.options_ta.c || '').trim();
                optD_ta = (q.options_ta.D || q.options_ta.d || '').trim();
            }
            
            // Split combined options
            if (optA_en && !optA_ta) {
                const p = splitEnTa(optA_en); optA_en = p.en; optA_ta = p.ta;
            }
            if (optB_en && !optB_ta) {
                const p = splitEnTa(optB_en); optB_en = p.en; optB_ta = p.ta;
            }
            if (optC_en && !optC_ta) {
                const p = splitEnTa(optC_en); optC_en = p.en; optC_ta = p.ta;
            }
            if (optD_en && !optD_ta) {
                const p = splitEnTa(optD_en); optD_en = p.en; optD_ta = p.ta;
            }
            
            // Get correct answer
            let correctAnswer = (q.correctAnswer || q.correct_answer || q.answer || '').toString().toUpperCase();
            
            // Convert number to letter if needed
            if (/^[1-4]$/.test(correctAnswer)) {
                correctAnswer = ['A', 'B', 'C', 'D'][parseInt(correctAnswer) - 1];
            }
            
            // Validate correct answer
            if (!['A', 'B', 'C', 'D'].includes(correctAnswer)) {
                return null; // Skip invalid
            }
            
            // Check we have content
            const hasQuestion = questionEn || questionTa;
            const hasEnOptions = optA_en && optB_en && optC_en && optD_en;
            const hasTaOptions = optA_ta && optB_ta && optC_ta && optD_ta;
            
            if (!hasQuestion || (!hasEnOptions && !hasTaOptions)) {
                return null; // Skip incomplete
            }
            
            return {
                session_id: sessionId,
                question_en: questionEn || null,
                question_ta: questionTa || null,
                option_a_en: optA_en || null,
                option_a_ta: optA_ta || null,
                option_b_en: optB_en || null,
                option_b_ta: optB_ta || null,
                option_c_en: optC_en || null,
                option_c_ta: optC_ta || null,
                option_d_en: optD_en || null,
                option_d_ta: optD_ta || null,
                correct_answer: correctAnswer,
                explanation_en: q.answerExplanation || q.explanation_en || null,
                explanation_ta: q.answerExplanation_ta || q.explanation_ta || null,
                difficulty: 'medium',
                marks: 1,
                negative_marks: 0,
                display_order: displayOrder
            };
        }
        
        function splitEnTa(text) {
            // Split English/Tamil from combined text
            const hasTamil = /[\u0B80-\u0BFF]/.test(text);
            
            if (!hasTamil) {
                return { en: text, ta: '' };
            }
            
            // Try splitting by <br>
            let parts = text.split(/<br\s*\/?>/i);
            if (parts.length >= 2) {
                const en = parts[0].trim();
                const ta = parts.slice(1).join(' ').trim();
                if (/[\u0B80-\u0BFF]/.test(ta)) {
                    return { en, ta };
                }
            }
            
            // Try splitting by newline
            parts = text.split(/\n/);
            if (parts.length >= 2) {
                const en = parts[0].trim();
                const ta = parts.slice(1).join(' ').trim();
                if (/[\u0B80-\u0BFF]/.test(ta)) {
                    return { en, ta };
                }
            }
            
            // Find where Tamil starts
            const tamilMatch = text.match(/([\u0B80-\u0BFF])/);
            if (tamilMatch) {
                const idx = text.indexOf(tamilMatch[0]);
                return {
                    en: text.substring(0, idx).trim(),
                    ta: text.substring(idx).trim()
                };
            }
            
            return { en: text, ta: '' };
        }
        
        function log(message, type = 'info') {
            const logEl = document.getElementById('logSection');
            const line = document.createElement('div');
            line.className = type;
            line.textContent = message;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }
    </script>
</body>
