<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP API Test - SUDAR TNPSC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #00d9ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            color: #00d9ff;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }
        input:focus {
            outline: none;
            border-color: #00d9ff;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d9ff, #a855f7);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-secondary {
            background: #334155;
            color: #fff;
            margin-top: 10px;
        }
        .result {
            background: #0f172a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { border-left: 4px solid #10b981; }
        .error { border-left: 4px solid #ef4444; }
        .loading { opacity: 0.7; pointer-events: none; }
        .otp-display {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(6,182,212,0.2));
            border-radius: 10px;
            margin-top: 15px;
        }
        .otp-value {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #10b981;
            font-family: monospace;
        }
        .status { padding: 8px 12px; border-radius: 5px; margin-top: 10px; font-size: 14px; }
        .status.ok { background: rgba(16,185,129,0.2); color: #10b981; }
        .status.fail { background: rgba(239,68,68,0.2); color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 OTP API Test</h1>
        
        <!-- Send OTP -->
        <div class="card">
            <h2>📱 Step 1: Send OTP</h2>
            <label>Mobile Number (10 digits)</label>
            <input type="text" id="mobile" placeholder="9876543210" maxlength="10" pattern="[0-9]{10}">
            <button class="btn-primary" onclick="sendOTP()">Send OTP</button>
            <div id="sendResult" class="result" style="display:none;"></div>
        </div>

        <!-- Verify OTP -->
        <div class="card">
            <h2>✅ Step 2: Verify OTP</h2>
            <label>Mobile Number</label>
            <input type="text" id="verifyMobile" placeholder="9876543210" maxlength="10">
            <label>OTP Code (6 digits)</label>
            <input type="text" id="otp" placeholder="123456" maxlength="6" pattern="[0-9]{6}">
            <button class="btn-primary" onclick="verifyOTP()">Verify OTP</button>
            <div id="verifyResult" class="result" style="display:none;"></div>
        </div>

        <!-- Resend OTP -->
        <div class="card">
            <h2>🔄 Resend OTP</h2>
            <label>Mobile Number</label>
            <input type="text" id="resendMobile" placeholder="9876543210" maxlength="10">
            <button class="btn-secondary" onclick="resendOTP()">Resend OTP</button>
            <div id="resendResult" class="result" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api/auth';

        async function sendOTP() {
            const mobile = document.getElementById('mobile').value.trim();
            if (mobile.length !== 10) {
                alert('Please enter a valid 10-digit mobile number');
                return;
            }

            const resultDiv = document.getElementById('sendResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Sending OTP...';

            try {
                const response = await fetch(API_BASE + '/send_otp.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile: mobile })
                });

                const data = await response.json();
                resultDiv.className = 'result ' + (data.success ? 'success' : 'error');
                resultDiv.innerHTML = JSON.stringify(data, null, 2);

                if (data.success) {
                    document.getElementById('verifyMobile').value = mobile;
                    document.getElementById('resendMobile').value = mobile;
                    
                    if (data.otp) {
                        resultDiv.innerHTML += '\n\n<div class="otp-display"><div class="otp-value">' + data.otp + '</div><small>Development Mode OTP</small></div>';
                    }
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }

        async function verifyOTP() {
            const mobile = document.getElementById('verifyMobile').value.trim();
            const otp = document.getElementById('otp').value.trim();

            if (mobile.length !== 10 || otp.length !== 6) {
                alert('Please enter valid mobile (10 digits) and OTP (6 digits)');
                return;
            }

            const resultDiv = document.getElementById('verifyResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Verifying OTP...';

            try {
                const response = await fetch(API_BASE + '/verify_otp.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile: mobile, otp: otp })
                });

                const data = await response.json();
                resultDiv.className = 'result ' + (data.success ? 'success' : 'error');
                resultDiv.innerHTML = JSON.stringify(data, null, 2);

                if (data.success) {
                    resultDiv.innerHTML = '<div class="status ok">✅ OTP VERIFIED SUCCESSFULLY!</div>\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }

        async function resendOTP() {
            const mobile = document.getElementById('resendMobile').value.trim();
            if (mobile.length !== 10) {
                alert('Please enter a valid 10-digit mobile number');
                return;
            }

            const resultDiv = document.getElementById('resendResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = 'Resending OTP...';

            try {
                const response = await fetch(API_BASE + '/resend_otp.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile: mobile })
                });

                const data = await response.json();
                resultDiv.className = 'result ' + (data.success ? 'success' : 'error');
                resultDiv.innerHTML = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }

        // Auto-copy mobile between fields
        document.getElementById('mobile').addEventListener('input', function() {
            document.getElementById('verifyMobile').value = this.value;
            document.getElementById('resendMobile').value = this.value;
        });
    </script>
</body>
</html>
